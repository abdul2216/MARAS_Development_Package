openapi: 3.1.0
info:
  title: MARAS API
  version: 1.0.0
  description: Initial API contract. Replace placeholder server before deployment.
servers:
  - url: https://api.example.invalid/v1
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      responses:
        "200": { description: Service healthy }
  /properties:
    get:
      summary: List properties accessible to caller
      responses:
        "200": { description: Accessible properties }
    post:
      summary: Create property
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, propertyType, addressLine, city]
              properties:
                name: { type: string, maxLength: 160 }
                propertyType: { type: string }
                addressLine: { type: string, maxLength: 300 }
                city: { type: string, maxLength: 100 }
                latitude: { type: number, minimum: -90, maximum: 90 }
                longitude: { type: number, minimum: -180, maximum: 180 }
      responses:
        "201": { description: Property created }
        "400": { description: Invalid input }
        "403": { description: Forbidden }
  /requests:
    get:
      summary: List requests visible to caller
      parameters:
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: propertyId
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Request list }
    post:
      summary: Create maintenance request
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema: { type: string, minLength: 8, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [propertyId, categoryId, title, description]
              properties:
                propertyId: { type: string, format: uuid }
                unitId: { type: string, format: uuid }
                categoryId: { type: string, format: uuid }
                title: { type: string, minLength: 3, maxLength: 160 }
                description: { type: string, minLength: 5, maxLength: 5000 }
                preferredAt: { type: string, format: date-time }
                fileIds:
                  type: array
                  maxItems: 10
                  items: { type: string, format: uuid }
      responses:
        "201": { description: Request created in NEW state }
        "400": { description: Invalid input }
        "403": { description: Forbidden }
  /requests/{requestId}:
    get:
      summary: Get authorized request details
      parameters:
        - in: path
          name: requestId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Request details }
        "403": { description: Forbidden }
        "404": { description: Not found }
  /requests/{requestId}/triage:
    post:
      summary: Triage request
      parameters:
        - in: path
          name: requestId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Triage saved }
        "409": { description: Invalid state transition }
  /requests/{requestId}/assignments:
    post:
      summary: Offer request to eligible provider
      parameters:
        - in: path
          name: requestId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201": { description: Assignment offered }
        "409": { description: Provider ineligible or invalid state }
  /requests/{requestId}/quotes:
    post:
      summary: Submit versioned quote
      parameters:
        - in: path
          name: requestId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201": { description: Quote submitted }
        "409": { description: Conflict }
  /requests/{requestId}/acceptance:
    post:
      summary: Accept, request rework, or dispute completed work
      parameters:
        - in: path
          name: requestId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201": { description: Decision recorded }
        "409": { description: Invalid state }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
